# Database lokal untuk development. Password di bawah HANYA untuk dev lokal.
# Jangan pakai password ini di server/produksi.
services:
  db:
    image: mysql:8.0
    container_name: gameedu-db
    environment:
      MYSQL_ROOT_PASSWORD: gameedu_dev
      MYSQL_DATABASE: gameedu
      MYSQL_USER: gameedu
      MYSQL_PASSWORD: gameedu_dev
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gameedu-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db
volumes:
  dbdata:
